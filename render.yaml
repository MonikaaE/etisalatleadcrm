# ────────────────────────────────────────────────────────────────
# Render Blueprint — Kyzen Lead CRM Platform
# Docs: https://render.com/docs/blueprint-spec
# ────────────────────────────────────────────────────────────────

services:
  # ─── Express API ───────────────────────────────────────────────
  - type: web
    name: kyzen-api
    runtime: node
    region: singapore  # closest to Dubai
    plan: free         # upgrade to starter ($7/mo) for always-on
    buildCommand: |
      npm ci &&
      npx prisma generate --schema=./prisma/schema.prisma &&
      npm run build --workspace=packages/shared &&
      npm run build --workspace=apps/api
    startCommand: "npx prisma migrate deploy --schema=./prisma/schema.prisma && node apps/api/dist/index.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false  # set manually in Render dashboard
      - key: REDIS_URL
        fromService:
          name: kyzen-redis
          type: redis
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 7d
      - key: APP_URL
        sync: false  # set to your kyzen-web URL after deploy
      - key: CORS_ORIGIN
        sync: false  # set to your kyzen-web URL after deploy
      - key: API_URL
        sync: false  # set to this service's URL
      - key: LOG_LEVEL
        value: info
      - key: UPLOAD_MAX_SIZE_MB
        value: 50
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false

  # ─── BullMQ Background Worker (runs as web service on free tier) ──
  - type: web
    name: kyzen-worker
    runtime: node
    region: singapore
    plan: free
    buildCommand: |
      npm ci &&
      npx prisma generate --schema=./prisma/schema.prisma &&
      npm run build --workspace=packages/shared &&
      npm run build --workspace=apps/worker
    startCommand: node apps/worker/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: kyzen-redis
          type: redis
          property: connectionString
      - key: LOG_LEVEL
        value: info

  # ─── React Frontend (Vite Static Site) ────────────────────────
  - type: web
    name: kyzen-web
    runtime: static
    buildCommand: |
      npm ci &&
      npm run build --workspace=packages/shared &&
      npm run build --workspace=apps/web
    staticPublishPath: apps/web/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # set to kyzen-api URL (e.g. https://kyzen-api.onrender.com)

  # ─── Redis (for BullMQ + caching) ─────────────────────────────
  - type: redis
    name: kyzen-redis
    region: singapore
    plan: free       # 25MB, good for queues
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # only allow internal access
